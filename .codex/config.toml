# Project-scoped MCP server. Codex loads this file after the repository is trusted.
# npm.cmd is used because this project targets Windows.
[mcp_servers.kintone]
command = "npm.cmd"
args = ["--prefix", "platform/ke-kintone-mcp", "run", "--silent", "mcp:kintone"]
startup_timeout_sec = 30
tool_timeout_sec = 120
# Expose all tools published by the pinned server from the initial load,
# including build, deploy/status and record testing. Loaded is not authorized.
# This is not per-App/account enforcement; task scope and approval still apply.
# `writes` prompts for tools not marked read-only; it does not make tools read-only.
default_tools_approval_mode = "writes"

# Primary browser channel for every KE expert. It opens a project-scoped
# isolated session by default, without requiring a project at server startup.
# Explicit project/role env binding opts into a persistent private profile.
[mcp_servers.playwright]
command = "npm.cmd"
args = ["--prefix", "platform/ke-browser-mcp", "run", "--silent", "mcp:playwright"]
startup_timeout_sec = 30
tool_timeout_sec = 120
default_tools_approval_mode = "writes"

# Diagnostic escalation channel. Use only after Playwright reproduces a
# JavaScript, network, DOM/CSS, or performance issue.
[mcp_servers.chrome-devtools]
command = "npm.cmd"
args = ["--prefix", "platform/ke-browser-mcp", "run", "--silent", "mcp:chrome-devtools"]
startup_timeout_sec = 30
tool_timeout_sec = 120
default_tools_approval_mode = "writes"

# Local expert-team skills. They are available after this project is trusted
# and Codex is restarted or the project is re-opened.
